<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="flashmind mark">
  <title>flashmind mark - top-right lit</title>
  <!-- chosen direction: 2x2 memory grid, top-right cell flashes (solid gold),
       three muted. ties to number-flash + site dot-grid. favicon source. -->
  <g transform="translate(2,2)">
    <rect x="0"  y="0"  width="16" height="16" rx="5" fill="none" stroke="#93a4b5" stroke-width="2"/>
    <rect x="20" y="0"  width="16" height="16" rx="5" fill="#f2b84b"/>
    <rect x="0"  y="20" width="16" height="16" rx="5" fill="none" stroke="#93a4b5" stroke-width="2"/>
    <rect x="20" y="20" width="16" height="16" rx="5" fill="none" stroke="#93a4b5" stroke-width="2"/>
  </g>
</svg>
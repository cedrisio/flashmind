<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="flashmind mark (one colour)">
  <title>flashmind mark - top-right lit, one colour</title>
  <!-- one-colour form: top-right solid, others stroked. fill/stroke via currentColor.
       must be inlined in DOM - <img> isolates currentColor from the html context. -->
  <g transform="translate(2,2)" fill="currentColor" stroke="currentColor">
    <rect x="0"  y="0"  width="16" height="16" rx="5" fill="none" stroke-width="2"/>
    <rect x="20" y="0"  width="16" height="16" rx="5" fill="currentColor" stroke="none"/>
    <rect x="0"  y="20" width="16" height="16" rx="5" fill="none" stroke-width="2"/>
    <rect x="20" y="20" width="16" height="16" rx="5" fill="none" stroke-width="2"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" role="img" aria-label="flashmind">
  <title>flashmind</title>
  <!-- mark: 2x2 memory grid, one cell flashes (solid gold), three muted tiles -->
  <g transform="translate(8,14)">
    <rect x="0"  y="0"  width="16" height="16" rx="5" fill="#f2b84b"/>
    <rect x="20" y="0"  width="16" height="16" rx="5" fill="none" stroke="#93a4b5" stroke-width="2"/>
    <rect x="0"  y="20" width="16" height="16" rx="5" fill="none" stroke="#93a4b5" stroke-width="2"/>
    <rect x="20" y="20" width="16" height="16" rx="5" fill="none" stroke="#93a4b5" stroke-width="2"/>
  </g>
  <!-- wordmark: lowercase, monospace 800. flash=gold, mind=text-white -->
  <text x="64" y="40" dominant-baseline="central"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="30" font-weight="800" letter-spacing="0.5" text-rendering="geometricPrecision">
    <tspan fill="#f2b84b">flash</tspan><tspan fill="#edf2f7">mind</tspan>
  </text>
</svg>